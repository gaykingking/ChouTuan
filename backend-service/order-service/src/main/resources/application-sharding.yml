spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:choutuan-prod}
        group: CHOUTUAN_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:choutuan-prod}
        file-extension: yml
  shardingsphere:
    props:
      sql-show: true
    datasource:
      names: ds_master,ds_slave_0
      ds_master:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_MASTER_HOST:127.0.0.1}:3306/choutuan_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASSWORD:choutuan123}
      ds_slave_0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_SLAVE_HOST:127.0.0.1}:3307/choutuan_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASSWORD:choutuan123}
    rules:
      readwrite-splitting:
        data-sources:
          readwrite_ds:
            static-strategy:
              write-data-source-name: ds_master
              read-data-source-names:
                - ds_slave_0
            load-balancer-name: round_robin
        load-balancers:
          round_robin:
            type: ROUND_ROBIN
      sharding:
        tables:
          t_order:
            actual-data-nodes: readwrite_ds.t_order_$->{0..1}
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: order_user_id_mod_2
            key-generate-strategy:
              column: order_id
              key-generator-name: snowflake
          t_profit_sharing_ledger:
            actual-data-nodes: readwrite_ds.t_profit_sharing_ledger_$->{0..1}
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: ledger_user_id_mod_2
            key-generate-strategy:
              column: id
              key-generator-name: snowflake
        sharding-algorithms:
          order_user_id_mod_2:
            type: INLINE
            props:
              algorithm-expression: t_order_$->{user_id % 2}
          ledger_user_id_mod_2:
            type: INLINE
            props:
              algorithm-expression: t_profit_sharing_ledger_$->{user_id % 2}
        key-generators:
          snowflake:
            type: SNOWFLAKE

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876;127.0.0.1:9877;127.0.0.1:9878}
  producer:
    group: choutuan-order-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    enable-msg-trace: true
  consumer:
    group: choutuan-order-timeout-consumer-group
    consume-thread-max: 32
    dledger-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order-service
      
