apiVersion: v1
kind: Namespace
metadata:
  name: choutuan-namespace
  labels:
    app.kubernetes.io/part-of: choutuan-platform
    platform: debian11-k3s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: choutuan-common-config
  namespace: choutuan-namespace
data:
  NACOS_SERVER_ADDR: "nacos-headless.choutuan-namespace.svc.cluster.local:8848"
  NACOS_NAMESPACE: "choutuan-prod"
  ROCKETMQ_NAMESRV_ADDR: "rocketmq-namesrv.choutuan-namespace.svc.cluster.local:9876"
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap.choutuan-namespace.svc.cluster.local:11800"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: choutuan-namespace
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      initContainers:
        - name: skywalking-agent-init
          image: apache/skywalking-java-agent:9.1.0-java17
          command: ["sh", "-c", "cp -r /skywalking/agent/* /skywalking-agent-vol/"]
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking-agent-vol
      containers:
        - name: gateway-service
          image: choutuan/gateway-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: choutuan-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -javaagent:/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=choutuan::gateway-service -Dskywalking.collector.backend_service=$(SW_AGENT_COLLECTOR_BACKEND_SERVICES)"
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: skywalking-agent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: choutuan-namespace
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: choutuan-namespace
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: skywalking-agent-init
          image: apache/skywalking-java-agent:9.1.0-java17
          command: ["sh", "-c", "cp -r /skywalking/agent/* /skywalking-agent-vol/"]
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking-agent-vol
      containers:
        - name: product-service
          image: choutuan/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: choutuan-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -javaagent:/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=choutuan::product-service -Dskywalking.collector.backend_service=$(SW_AGENT_COLLECTOR_BACKEND_SERVICES)"
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: skywalking-agent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: choutuan-namespace
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: choutuan-namespace
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: skywalking-agent-init
          image: apache/skywalking-java-agent:9.1.0-java17
          command: ["sh", "-c", "cp -r /skywalking/agent/* /skywalking-agent-vol/"]
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking-agent-vol
      containers:
        - name: order-service
          image: choutuan/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: choutuan-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -javaagent:/skywalking/agent/skywalking-agent.jar -Dskywalking.agent.service_name=choutuan::order-service -Dskywalking.collector.backend_service=$(SW_AGENT_COLLECTOR_BACKEND_SERVICES)"
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /order-service/api/v1/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /order-service/api/v1/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: skywalking-agent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: choutuan-namespace
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
